# Left and right BlueRobotics USB cameras (H264 USB Camera, 32e4:9422).
#
# One node instance per side, named left_camera / right_camera.
#
#
# WHICH DEVICE IS WHICH SIDE
# --------------------------
# Both cameras are the same model and report the SAME USB serial
# (2020032801), so /dev/v4l/by-id/ collapses them onto one symlink and
# cannot tell them apart. /dev/videoN is not stable either -- the numbers
# follow enumeration order and can swap between boots, which would
# quietly mirror the robot's two side views.
#
# The USB port is the only stable discriminator, so the devices below are
# /dev/v4l/by-path/ symlinks. As enumerated on this Jetson:
#
#     port 2.1.1  ->  /dev/video0..3
#     port 2.1.3  ->  /dev/video4..7
#
# Only index0 of each group actually captures; index1-3 refuse to open.
#
# The HUB PREFIX IS NOT FOREVER. These paths read 2.2.1/2.2.3 until the
# hub was moved to a different port on the Jetson, and both went stale at
# once -- the nodes then fail with
#
#     cannot open /dev/v4l/by-path/platform-3610000.usb-usb-0:2.2.3:...
#
# `ls /dev/v4l/by-path/` is the whole diagnosis: if the prefix there is
# not the one below, re-point both devices at what is actually
# enumerated. Only the trailing .1 / .3 tells the two cameras apart.
#
# The assignment below is CONFIRMED ON THE ROBOT, 2026-09-24, on the
# 2.1.x hub: port 2.1.1 is the LEFT camera and 2.1.3 is the RIGHT one.
#
# That is the OPPOSITE of the earlier hubs (2.2.x, 2.4.x), where x.3 was
# left and x.1 right. Carrying that sense over after the hub moved came
# out visibly mirrored, so the sub-port number is NOT a fixed property of
# the camera -- replugging can flip it. Re-check on camera after ANY
# replug, not just a hub move:
#
#     ros2 run rqt_image_view rqt_image_view /capture/camera_left/img
#
# and if the sides are swapped, either exchange the two device paths in
# this file, or override them at launch without rebuilding:
#
#     ros2 launch launch/perception_oakd.py \
#         left_camera_device:=/dev/v4l/by-path/platform-3610000.usb-usb-0:2.1.3:1.0-video-index0 \
#         right_camera_device:=/dev/v4l/by-path/platform-3610000.usb-usb-0:2.1.1:1.0-video-index0
#
# (that example is the reverse of the mapping below -- use it only if
# the views come out mirrored.)

/left_camera:
  ros__parameters:
    device: /dev/v4l/by-path/platform-3610000.usb-usb-0:2.1.1:1.0-video-index0
    frame_id: left_camera_link

    raw_topic: /capture/camera_left/img
    compressed_topic: /capture/camera_left/img/compressed

    # MJPG, not YUYV: uncompressed YUYV is bandwidth-capped on this USB 2.0
    # bus and silently degrades to 800x600@16fps when 720p is requested.
    # Measured here: MJPG does 1920x1080@33fps, so 720p has plenty of headroom
    # even with both cameras streaming at once.
    fourcc: MJPG
    width: 1280
    height: 720
    fps: 30.0

    publish_raw: true
    publish_compressed: true

    # 1-100. 80 is a good size/quality tradeoff for streaming over WiFi.
    jpeg_quality: 80

    # 'reliable' (default) or 'best_effort'. Keep reliable: the rover's
    # consumers subscribe with a plain depth-10 RELIABLE profile, and a
    # BEST_EFFORT publisher would not match one -- the topic would look
    # silent from `ros2 topic echo` and rqt_image_view too.
    qos_reliability: reliable

    # 0.0 = publish every frame captured. Two 720p RELIABLE raw streams
    # are ~2.7 MB per frame pair; set this to e.g. 10.0 if the side views
    # are only for situational awareness and you want the bandwidth back.
    publish_rate_hz: 0.0

    # Set true if this camera is mounted upside down.
    flip_180: false

    # Consecutive failed reads before the device is closed and reopened.
    # A USB camera that browns out or re-enumerates never recovers on its
    # own -- it just returns False forever.
    reopen_after_failures: 30

    # V4L2 driver queue depth. 0 = leave the driver's own default, which
    # is what you want. Setting this to 1 "for low latency" backfires on
    # this driver: measured 16 fps with it against 32 fps without.
    buffer_size: 0

/right_camera:
  ros__parameters:
    device: /dev/v4l/by-path/platform-3610000.usb-usb-0:2.1.3:1.0-video-index0
    frame_id: right_camera_link

    raw_topic: /capture/camera_right/img
    compressed_topic: /capture/camera_right/img/compressed

    fourcc: MJPG
    width: 1280
    height: 720
    fps: 30.0

    publish_raw: true
    publish_compressed: true
    jpeg_quality: 80
    qos_reliability: reliable
    publish_rate_hz: 0.0
    flip_180: false
    reopen_after_failures: 30
    buffer_size: 0
