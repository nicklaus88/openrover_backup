services:

  ros2:

    build:
      context: .
      dockerfile: Dockerfile
      args:
        USER_UID: ${HOST_UID}
        USER_GID: ${HOST_GID}

    image: robopi_ros2_humble:latest

    container_name: ros2_humble


    # ========================================================
    # ROS 2 DDS networking
    # ========================================================

    network_mode: host

    ipc: host


    # ========================================================
    # NVIDIA Jetson runtime
    # ========================================================

    runtime: nvidia


    # ========================================================
    # Hardware access
    #
    # Useful for:
    # OAK-D
    # RPLIDAR
    # USB serial
    # cameras
    # joystick
    # ========================================================

    privileged: true


    # Supplementary groups for the container user (ros, uid 1000).
    #
    # `privileged: true` lifts the cgroup device-access restriction, but it
    # does NOT bypass the ordinary file-permission check on the device node
    # itself. /dev/ttyACM0 (the MSP flight controller) is root:dialout 0660,
    # so a non-root user still needs to be *in* dialout to open it -- root
    # works only because it has CAP_DAC_OVERRIDE. Without this, the `base`
    # node dies at startup with
    # `terminate called ... std::runtime_error what(): Permission denied`.
    #
    # GID 20 (dialout) is numeric on purpose: the node comes from the host's
    # /dev, so the number is what the kernel checks -- it happens to be 20 on
    # both the Jetson host and inside the Jammy image.
    #
    # GID 993 (render) is the same story for the GPU. On JetPack 7 the CUDA
    # driver opens the DRM render node /dev/dri/renderD12*, which is
    # root:render 0660 -- so a non-root user outside group 993 gets
    # `cuInit -> 801 (CUDA_ERROR_NOT_SUPPORTED)` and torch.cuda.is_available()
    # returns False, even though nvidia-smi works. Older JetPack only needed
    # `video` for the /dev/nvhost-* nodes, which is why this is easy to miss.
    group_add:
      - "20"
      - "993"


    # ========================================================
    # Environment
    # ========================================================

    environment:

      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID}

      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION}

      ROS_LOCALHOST_ONLY: 0

      # Fast DDS Discovery Server.
      #
      # These are the *inputs*; ROS_DISCOVERY_SERVER itself is not set here.
      # It is assembled inside the container by /ros_env.sh, because the
      # address the server is reachable on is the host's DHCP wifi address
      # and is therefore only knowable at run time. `network_mode: host`
      # above is what lets the container read it -- the Jetson's wifi
      # interface is literally the container's own.
      #
      # Defaults to 0: the rover runs self-contained on the Jetson and no
      # server is started. The fallback matters because it is what applies
      # when .env is missing or does not set the variable -- an absent .env
      # must not be what silently turns a discovery server back on.
      ROS_DISCOVERY_SERVER_ENABLE: ${ROS_DISCOVERY_SERVER_ENABLE:-0}

      ROS_DISCOVERY_PORT: ${ROS_DISCOVERY_PORT:-11811}

      ROS_SUPER_CLIENT: ${ROS_SUPER_CLIENT:-True}

      # Empty unless the TurtleBot 4 runs its own server -- see .env.
      TURTLEBOT4_DISCOVERY_IP: ${TURTLEBOT4_DISCOVERY_IP:-}

      NVIDIA_VISIBLE_DEVICES: all

      NVIDIA_DRIVER_CAPABILITIES: all

      # GUI apps (rqt, rviz2, rqt_image_view, ...) -- talk to the host's
      # X server. Requires `xhost +local:` on the host (enter_ros.sh does
      # this automatically) and the X11 socket mount below.
      DISPLAY: ${DISPLAY}

      QT_X11_NO_MITSHM: 1


    # ========================================================
    # Mounts
    # ========================================================

    volumes:

      # ROS workspace
      - ./ros2_ws:/workspace/ros2_ws
      - ./ROS2-WorkSpace:/workspace/ROS2-WorkSpace

      # USB / camera / serial / lidar
      - /dev:/dev

      # Host time
      - /etc/localtime:/etc/localtime:ro

      # Host X server, for GUI apps
      - /tmp/.X11-unix:/tmp/.X11-unix:rw


    # Helpful with large camera streams
    shm_size: "1gb"


    working_dir: /workspace/ROS2-WorkSpace


    stdin_open: true
    tty: true


    command: bash
